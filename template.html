<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="https://goldilocksdesign.com/">
  <meta name="twitter:card" content="summary">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="https://goldilocksdesign.com/">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23c08a2e'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fbf9f4;
      --text: #24211c;
      --muted: #7a7266;
      --rule: #e4ded2;
      --accent: #9a6a1c;
      --selection: #f1e2c2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161513;
        --text: #e8e3d9;
        --muted: #9a9284;
        --rule: #34312b;
        --accent: #d9a84e;
        --selection: #4a3c22;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      font-size: clamp(18px, 1rem + 0.35vw, 21px);
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
      font-optical-sizing: auto;
      line-height: 1.65;
      font-feature-settings: "kern", "liga", "onum";
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--selection); }

    main {
      max-width: 34rem;
      margin: 0 auto;
      padding: clamp(3rem, 10vh, 7rem) 1rem 5rem;
    }

    header {
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--rule);
    }

    h1 {
      font-size: clamp(2rem, 1.4rem + 2.6vw, 2.9rem);
      line-height: 1.12;
      font-weight: 600;
      letter-spacing: -0.015em;
      margin: 0 0 0.6rem;
      text-wrap: balance;
    }

    .subtitle {
      font-size: 1.2rem;
      font-style: italic;
      color: var(--muted);
      margin: 0 0 1.5rem;
    }

    .byline {
      font-size: 0.85rem;
      color: var(--muted);
      margin: 0;
    }
    .byline::after {
      content: " · {{minutes}} min read";
    }

    h2 {
      font-size: 1.4rem;
      line-height: 1.25;
      font-weight: 600;
      margin: 3rem 0 1rem;
      text-wrap: balance;
    }

    p {
      margin: 0 0 1.25rem;
      hanging-punctuation: first;
    }
    @media (max-width: 30rem) {
      p { hyphens: auto; }
    }

    a {
      color: inherit;
      text-decoration: underline;
      text-decoration-color: var(--rule);
      text-decoration-thickness: 1px;
      text-underline-offset: 0.2em;
      transition: text-decoration-color 0.15s, color 0.15s;
    }
    a:hover { color: var(--accent); text-decoration-color: currentColor; }

    .cite {
      font-size: 0.8em;
      color: var(--muted);
      white-space: nowrap;
      font-feature-settings: "lnum";
    }
    .cite a { text-decoration: none; }

    #references ~ ol {
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--muted);
      padding-left: 1.6rem;
      font-feature-settings: "lnum";
    }
    #references ~ ol li { margin-bottom: 0.6rem; overflow-wrap: anywhere; }
    #references ~ ol li:target { color: var(--text); }
    #references ~ ol li:target::marker { color: var(--accent); }

    h2, li { scroll-margin-top: 2rem; }

    footer {
      max-width: 34rem;
      margin: 0 auto;
      padding: 2rem 1rem 4rem;
      border-top: 1px solid var(--rule);
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <article>
{{content}}
    </article>
  </main>
  <footer>goldilocksdesign.com</footer>
</body>
</html>
