<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · Goldilocks Design</title>
  <meta name="description" content="{{description}}">
  <meta name="author" content="Jan Rod, Miha Feus">
  <meta property="og:type" content="article">
  <meta property="article:published_time" content="{{published}}">
  <meta property="og:site_name" content="Goldilocks Design">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{url}}og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{title}} — {{subtitle}}, by Jan Rod and Miha Feus">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{url}}og.png">
  <link rel="canonical" href="{{url}}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23555555'/></svg>">
  <link rel="preload" href="fonts/source-serif-4-roman.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/source-serif-4-italic.woff2" as="font" type="font/woff2" crossorigin>
  <style>
{{style}}
  </style>
  <script>
    // Apply a theme the reader picked before (see the toggle in script.js).
    try {
      const theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch {}

    // Keep the page hidden until the typeface has loaded (at most 3s), so it
    // never appears in a fallback font first. Without script it shows at once.
    (() => {
      const root = document.documentElement;
      root.classList.add('fonts-loading');
      const fonts = ['400 1em "Source Serif 4"', 'italic 400 1em "Source Serif 4"', '600 1em "Source Serif 4"'];
      const loaded = Promise.all(fonts.map((f) => document.fonts.load(f))).catch(() => {});
      const timeout = new Promise((resolve) => setTimeout(resolve, 3000));
      Promise.race([loaded, timeout]).then(() => root.classList.remove('fonts-loading'));
    })();
  </script>
</head>
<body>
  <div class="progress" aria-hidden="true"><div class="progress-bar"></div></div>
  <div class="time-pill" aria-hidden="true"></div>
  <button type="button" class="theme-toggle" aria-label="Switch to dark mode">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11Z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
  </button>

  <nav class="toc" aria-label="Sections">
    <ol>
{{toc}}
    </ol>
    <p class="toc-time" aria-hidden="true">{{minutes}} min read</p>
  </nav>

  <main class="col">
    <div class="masthead">
      <p class="site-name"><a href="/">Goldilocks Design</a></p>
      <p class="preamble">Goldilocks Design is a vehicle for deeper thinking about design: the role it should play in shaping technology, and how technology should be designed for the next world.</p>
    </div>
    <article data-minutes="{{minutes}}">
{{content}}
    </article>
  </main>

  <footer class="col">
    <span>© {{year}} Goldilocks Design</span>
    <button type="button" class="print-btn">Print or save as PDF</button>
  </footer>

  <script>
{{script}}
  </script>
  <script data-goatcounter="https://janrod.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
