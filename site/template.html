<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="author" content="Jan Rod, Miha Feus">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Goldilocks Design">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{url}}og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{title}} — Designing for LLM world, by Jan Rod and Miha Feus">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{url}}og.png">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="{{url}}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23c08a2e'/></svg>">
  <link rel="preload" href="fonts/source-serif-4-roman.woff2" as="font" type="font/woff2" crossorigin>
  <style>
{{style}}
  </style>
</head>
<body>
  <div class="progress" aria-hidden="true"><div class="progress-bar"></div></div>
  <div class="time-pill" aria-hidden="true"></div>

  <nav class="toc" aria-label="Sections">
    <ol>
{{toc}}
    </ol>
    <p class="toc-time" aria-hidden="true">{{minutes}} min read</p>
  </nav>

  <main class="col">
    <article data-minutes="{{minutes}}">
{{content}}
    </article>
  </main>

  <footer class="col">
    <span>goldilocksdesign.com</span>
    <button type="button" class="print-btn">Print or save as PDF</button>
  </footer>

  <script>
{{script}}
  </script>
</body>
</html>
