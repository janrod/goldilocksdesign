<!doctype html>
<!-- Source for public/og.png, the link preview image. Regenerate with `npm run og`. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Source Serif 4";
    src: url("../public/fonts/source-serif-4-roman.woff2") format("woff2");
    font-weight: 200 900;
    font-style: normal;
  }
  @font-face {
    font-family: "Source Serif 4";
    src: url("../public/fonts/source-serif-4-italic.woff2") format("woff2");
    font-weight: 200 900;
    font-style: italic;
  }
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    padding: 72px 88px 64px;
    display: flex;
    flex-direction: column;
    background: #fbfbfb;
    color: #1f1f1f;
    font-family: "Source Serif 4", Georgia, serif;
    font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased;
  }
  .site {
    display: flex;
    align-items: center;
    gap: 14px;
    color: #737373;
    letter-spacing: 0.06em;
    font-variant-caps: all-small-caps;
    font-size: 28px;
  }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: #1f1f1f; }
  h1 {
    margin: auto 0 0;
    font-size: 84px;
    line-height: 1.04;
    font-weight: 600;
    letter-spacing: -0.02em;
    max-width: 960px;
  }
  .subtitle {
    margin: 22px 0 0;
    font-size: 38px;
    font-style: italic;
    color: #737373;
  }
  .rule { height: 3px; width: 96px; background: #1f1f1f; margin: 44px 0 26px; }
  .byline { margin: 0; font-size: 28px; color: #444444; }
</style>
</head>
<body>
  <div class="site"><span class="dot"></span>goldilocksdesign.com</div>
  <h1>Anthropomorphistic Machines: Who&nbsp;Is&nbsp;Speaking?</h1>
  <p class="subtitle">Designing for Authorship in the Age of LLMs</p>
  <div class="rule"></div>
  <p class="byline">Jan Rod &amp; Miha Feus</p>
</body>
</html>
