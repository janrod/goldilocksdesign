<!doctype html>
<!-- Source for public/ja/og.png, the link preview image. Regenerate with `npm run og`. -->
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Source Serif 4";
    src: url("../public/fonts/source-serif-4-roman.woff2") format("woff2");
    font-weight: 200 900;
    font-style: normal;
  }
  @font-face {
    font-family: "Source Serif 4";
    src: url("../public/fonts/source-serif-4-italic.woff2") format("woff2");
    font-weight: 200 900;
    font-style: italic;
  }
  @font-face {
    font-family: "Noto Serif JP GD";
    src: url("../public/fonts/noto-serif-jp.woff2") format("woff2");
    font-weight: 400 700;
  }
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    padding: 72px 88px 64px;
    display: flex;
    flex-direction: column;
    background: #fbfbfb;
    color: #1f1f1f;
    font-family: "Noto Serif JP GD", "Source Serif 4", serif;
    line-break: strict;
    font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased;
  }
  .site {
    display: flex;
    align-items: center;
    gap: 14px;
    color: #737373;
    letter-spacing: 0.06em;
    font-variant-caps: all-small-caps;
    font-size: 28px;
  }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: #1f1f1f; }
  h1 {
    margin: auto 0 0;
    font-weight: 600;
    font-size: 76px;
    line-height: 1.25;
    letter-spacing: 0.02em;
    font-feature-settings: "palt";
    max-width: 1024px;
  }
  .subtitle {
    margin: 22px 0 0;
    font-size: 36px;
    letter-spacing: 0.04em;
    font-feature-settings: "palt";
    color: #737373;
  }
  .rule { height: 3px; width: 96px; background: #1f1f1f; margin: 44px 0 26px; }
  .byline { margin: 0; font-size: 28px; color: #444444; }
</style>
</head>
<body>
  <div class="site"><span class="dot"></span>goldilocksdesign.com</div>
  <h1>擬人化する機械――<br>語っているのは誰か</h1>
  <p class="subtitle">LLM時代における、作者性のためのデザイン</p>
  <div class="rule"></div>
  <p class="byline">Jan Rod、Miha Feus</p>
</body>
</html>
